# ── Servidor ──────────────────────────────────────────────────────────────
# Porta 8081 porque a Evolution API vai usar a 8080 por padrão
server.port=8081
server.servlet.context-path=/api

# Seeder de dados fictícios — desligado por padrão
app.seed.enabled=false
app.seed.student-count=300

# ── PostgreSQL ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/cpa_whatsapp
spring.datasource.username=postgres
spring.datasource.password=171098

# ── JPA / Hibernate ────────────────────────────────────────────────────────
# validate = Hibernate verifica se as entidades batem com o banco,
# mas QUEM cria as tabelas é o Flyway (migrations SQL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────
app.jwt.secret=cpa-whatsapp-secret-key-minimo-32-caracteres-aqui
app.jwt.expiration-ms=86400000

# ── ID da instituição padrão ─── (temporário no banco após o register) ────
app.institution-id=f6efacc7-6564-4dad-8669-e649540441d7

# ── Evolution API ─────────────────────────────────────────────────────────
app.evolution.base-url=http://localhost:8080
app.evolution.api-key=cpa-evolution-key-2025
app.evolution.instance=cpa-bot

